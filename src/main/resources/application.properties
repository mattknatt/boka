# Application name
spring.application.name=Boka

# Active profile (remove this line to run in production)
#spring.profiles.active=dev

# Server port
server.address=0.0.0.0
server.port=8080

server.forward-headers-strategy=framework

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.defer-datasource-initialization=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true


# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security (Google OAuth2 Configuration)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# Security (temporary - for local testing)
spring.security.user.name=admin
spring.security.user.password=admin

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.info.title=Boka API
springdoc.info.description=Gym class booking platform — REST API
springdoc.info.version=1.0.0
